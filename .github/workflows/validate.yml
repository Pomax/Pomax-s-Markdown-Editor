name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check-label:
    if: "!contains(github.event.pull_request.labels.*.name, 'no-ci')"
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI not skipped"

  test-windows:
    needs: check-label
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts && npm run setup && npm test

  test-macos:
    needs: check-label
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts && npm run setup && npm test

  test-linux:
    needs: check-label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts && npm run setup
      - run: xvfb-run --auto-servernum npm test
